[package]
name = "pulldown-cmark-wasm"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CJK-friendly emphasis is not released on crates.io yet (latest 0.13.4).
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark", rev = "953e44a", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
